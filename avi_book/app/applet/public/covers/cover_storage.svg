<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <!-- Paper texture gradient -->
    <linearGradient id="paperBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="25%" stop-color="#f8f4ec"/>
      <stop offset="70%" stop-color="#f3ede2"/>
      <stop offset="100%" stop-color="#ece4d6"/>
    </linearGradient>

    <!-- Card shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08" flood-color="#000000"/>
    </filter>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.18" flood-color="#000000"/>
    </filter>
  </defs>

  <!-- Background Paper -->
  <rect width="800" height="1200" fill="url(#paperBg)"/>
  
  <!-- Subtle book spine left crease -->
  <rect x="0" y="0" width="18" height="1200" fill="#000000" opacity="0.06"/>
  <line x1="18" y1="0" x2="18" y2="1200" stroke="#000000" stroke-width="0.75" opacity="0.12"/>

  <!-- ==================== HEADER TYPOGRAPHY ==================== -->
  <text x="400" y="115" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" letter-spacing="3" text-anchor="middle" fill="#141c24">
    THINK LIKE A
  </text>
  <text x="400" y="240" font-family="'Impact', 'Arial Black', sans-serif" font-size="140" font-weight="900" letter-spacing="-2" text-anchor="middle" fill="#141c24">
    LINUX
  </text>
  <text x="400" y="355" font-family="'Impact', 'Arial Black', sans-serif" font-size="124" font-weight="900" letter-spacing="-1" text-anchor="middle" fill="#b9251e">
    STORAGE
  </text>
  <text x="400" y="465" font-family="'Impact', 'Arial Black', sans-serif" font-size="112" font-weight="900" letter-spacing="-1" text-anchor="middle" fill="#b9251e">
    ENGINEER
  </text>

  <!-- Dot Separator -->
  <circle cx="400" cy="492" r="5" fill="#1e293b"/>

  <!-- Subtitle -->
  <text x="400" y="528" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#1e293b">
    From Linux I/O Internals to Filesystems, blk-mq,
  </text>
  <text x="400" y="556" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">
    <tspan fill="#b9251e">RAID, NVMe</tspan>
    <tspan fill="#1e293b"> and </tspan>
    <tspan fill="#b9251e">Storage Debugging</tspan>
  </text>

  <!-- ==================== QUOTE BRUSH BANNER ==================== -->
  <g transform="translate(100, 580)">
    <!-- Brush stroke banner shape -->
    <path d="M 0,22 Q 25,6 60,18 Q 200,4 320,16 Q 480,2 560,14 Q 590,18 600,24 Q 585,42 550,38 Q 420,44 260,38 Q 120,44 30,36 Q 5,34 0,22 Z" fill="#101720" filter="url(#badgeShadow)"/>
    <rect x="25" y="6" width="550" height="34" rx="4" fill="#101720"/>
    
    <text x="300" y="29" font-family="'Georgia', serif" font-size="15" font-style="italic" font-weight="bold" text-anchor="middle" fill="#facc15">
      “ Learn not just how Linux storage works, but why it is designed that way. ”
    </text>
  </g>

  <!-- ==================== 4 TECHNICAL PILLARS ==================== -->
  <g transform="translate(60, 642)">
    <!-- 1. Physical Storage Devices -->
    <g transform="translate(0, 0)">
      <rect width="158" height="96" rx="6" fill="#ffffff" stroke="#e2d8c7" stroke-width="1.2" filter="url(#cardShadow)"/>
      <!-- Isometric Drive Stack Graphic -->
      <g transform="translate(54, 12)">
        <polygon points="25,5 45,15 25,25 5,15" fill="#334155" stroke="#1e293b" stroke-width="1"/>
        <polygon points="5,15 25,25 25,32 5,22" fill="#1e293b"/>
        <polygon points="45,15 25,25 25,32 45,22" fill="#0f172a"/>
        <polygon points="5,24 25,34 25,41 5,31" fill="#475569"/>
        <polygon points="45,24 25,34 25,41 45,31" fill="#334155"/>
        <line x1="25" y1="5" x2="25" y2="25" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="2 2"/>
      </g>
      <text x="79" y="70" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#1e293b">Physical Storage</text>
      <text x="79" y="85" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#1e293b">Devices</text>
    </g>

    <!-- 2. Kernel Data Path Walkthrough -->
    <g transform="translate(174, 0)">
      <rect width="158" height="96" rx="6" fill="#ffffff" stroke="#e2d8c7" stroke-width="1.2" filter="url(#cardShadow)"/>
      <!-- VFS / Block Layer / Request Stack -->
      <g transform="translate(38, 12)">
        <rect x="12" y="2" width="58" height="11" rx="2" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
        <text x="41" y="10.5" font-family="monospace" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#0f172a">VFS</text>
        <line x1="41" y1="13" x2="41" y2="17" stroke="#64748b" stroke-width="1.5"/>
        <rect x="12" y="17" width="58" height="11" rx="2" fill="#e2e8f0" stroke="#334155" stroke-width="1"/>
        <text x="41" y="25.5" font-family="monospace" font-size="7" font-weight="bold" text-anchor="middle" fill="#0f172a">Block Layer</text>
        <line x1="41" y1="28" x2="41" y2="32" stroke="#64748b" stroke-width="1.5"/>
        <rect x="12" y="32" width="58" height="11" rx="2" fill="#cbd5e1" stroke="#334155" stroke-width="1"/>
        <text x="41" y="40.5" font-family="monospace" font-size="7" font-weight="bold" text-anchor="middle" fill="#0f172a">Request</text>
      </g>
      <text x="79" y="70" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#1e293b">Kernel Data Path</text>
      <text x="79" y="85" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#1e293b">Walkthrough</text>
    </g>

    <!-- 3. blk-mq Inner Workings -->
    <g transform="translate(348, 0)">
      <rect width="158" height="96" rx="6" fill="#ffffff" stroke="#e2d8c7" stroke-width="1.2" filter="url(#cardShadow)"/>
      <!-- blk-mq Queues Graphic -->
      <g transform="translate(24, 14)">
        <rect x="2" y="14" width="34" height="16" rx="2" fill="#f1f5f9" stroke="#334155" stroke-width="1"/>
        <text x="19" y="25" font-family="monospace" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#0f172a">blk-mq</text>
        <line x1="36" y1="22" x2="46" y2="22" stroke="#334155" stroke-width="1.5"/>
        <!-- Queue Slots -->
        <rect x="46" y="8" width="8" height="8" fill="#e2e8f0" stroke="#334155" stroke-width="0.8"/>
        <rect x="46" y="18" width="8" height="8" fill="#e2e8f0" stroke="#334155" stroke-width="0.8"/>
        <rect x="46" y="28" width="8" height="8" fill="#e2e8f0" stroke="#334155" stroke-width="0.8"/>
        <!-- Target Core -->
        <line x1="54" y1="22" x2="68" y2="22" stroke="#334155" stroke-width="1.5"/>
        <rect x="68" y="14" width="36" height="16" rx="2" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>
        <text x="86" y="25" font-family="monospace" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#991b1b">Core</text>
      </g>
      <text x="79" y="70" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#1e293b">blk-mq</text>
      <text x="79" y="85" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#1e293b">Inner Workings</text>
    </g>

    <!-- 4. Multipathing and ANA Concepts -->
    <g transform="translate(522, 0)">
      <rect width="158" height="96" rx="6" fill="#ffffff" stroke="#e2d8c7" stroke-width="1.2" filter="url(#cardShadow)"/>
      <!-- Multipath Lines to Disk Cylinder -->
      <g transform="translate(36, 12)">
        <line x1="6" y1="8" x2="38" y2="20" stroke="#334155" stroke-width="1.5"/>
        <line x1="6" y1="16" x2="38" y2="21" stroke="#334155" stroke-width="1.5"/>
        <line x1="6" y1="26" x2="38" y2="22" stroke="#334155" stroke-width="1.5"/>
        <line x1="6" y1="34" x2="38" y2="24" stroke="#334155" stroke-width="1.5"/>
        <!-- Storage Cylinder -->
        <ellipse cx="56" cy="12" rx="14" ry="5" fill="#94a3b8" stroke="#1e293b" stroke-width="1"/>
        <rect x="42" y="12" width="28" height="24" fill="#64748b" stroke="#1e293b" stroke-width="1"/>
        <ellipse cx="56" cy="36" rx="14" ry="5" fill="#475569" stroke="#1e293b" stroke-width="1"/>
      </g>
      <text x="79" y="70" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#1e293b">Multipathing and</text>
      <text x="79" y="85" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#1e293b">ANA Concepts</text>
    </g>
  </g>

  <!-- ==================== SCENIC ENGRAVING LANDSCAPE ==================== -->
  <g transform="translate(0, 755)">
    <!-- Setting Sun -->
    <circle cx="410" cy="115" r="46" fill="#e2573e"/>

    <!-- Distant Mountain Peaks (Engraved cross-hatch style) -->
    <polygon points="0,170 120,60 210,135 340,30 450,140 550,50 680,130 800,45 800,260 0,260" fill="#202a36"/>
    <!-- Mountain Snow Highlights -->
    <polygon points="120,60 135,95 105,95" fill="#e2e8f0" opacity="0.8"/>
    <polygon points="340,30 365,80 320,80" fill="#e2e8f0" opacity="0.9"/>
    <polygon points="550,50 575,95 530,95" fill="#e2e8f0" opacity="0.85"/>
    <polygon points="800,45 780,90 800,100" fill="#e2e8f0" opacity="0.8"/>

    <!-- Server Racks in Mountains (Left side) -->
    <g transform="translate(230, 95)">
      <rect x="0" y="0" width="36" height="75" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
      <line x1="4" y1="12" x2="32" y2="12" stroke="#38bdf8" stroke-width="1"/>
      <line x1="4" y1="24" x2="32" y2="24" stroke="#38bdf8" stroke-width="1"/>
      <line x1="4" y1="36" x2="32" y2="36" stroke="#38bdf8" stroke-width="1"/>
      <line x1="4" y1="48" x2="32" y2="48" stroke="#38bdf8" stroke-width="1"/>
      <line x1="4" y1="60" x2="32" y2="60" stroke="#38bdf8" stroke-width="1"/>

      <rect x="42" y="-10" width="40" height="85" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
      <line x1="46" y1="6" x2="78" y2="6" stroke="#38bdf8" stroke-width="1"/>
      <line x1="46" y1="18" x2="78" y2="18" stroke="#38bdf8" stroke-width="1"/>
      <line x1="46" y1="30" x2="78" y2="30" stroke="#38bdf8" stroke-width="1"/>
      <line x1="46" y1="42" x2="78" y2="42" stroke="#38bdf8" stroke-width="1"/>
      <line x1="46" y1="54" x2="78" y2="54" stroke="#38bdf8" stroke-width="1"/>
      <line x1="46" y1="66" x2="78" y2="66" stroke="#38bdf8" stroke-width="1"/>
    </g>

    <!-- Server Racks (Right side) -->
    <g transform="translate(680, 120)">
      <rect x="0" y="0" width="34" height="65" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
      <line x1="4" y1="12" x2="30" y2="12" stroke="#38bdf8" stroke-width="1"/>
      <line x1="4" y1="24" x2="30" y2="24" stroke="#38bdf8" stroke-width="1"/>
      <line x1="4" y1="36" x2="30" y2="36" stroke="#38bdf8" stroke-width="1"/>
      <line x1="4" y1="48" x2="30" y2="48" stroke="#38bdf8" stroke-width="1"/>
      <rect x="40" y="-8" width="36" height="73" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
      <line x1="44" y1="12" x2="72" y2="12" stroke="#38bdf8" stroke-width="1"/>
      <line x1="44" y1="24" x2="72" y2="24" stroke="#38bdf8" stroke-width="1"/>
      <line x1="44" y1="36" x2="72" y2="36" stroke="#38bdf8" stroke-width="1"/>
      <line x1="44" y1="48" x2="72" y2="48" stroke="#38bdf8" stroke-width="1"/>
    </g>

    <!-- Hard Drive Actuator Arm Road curving through landscape -->
    <path d="M 80,310 C 120,240 220,180 380,240 C 480,270 540,290 640,310 L 0,310 Z" fill="#334155" opacity="0.3"/>
    
    <!-- HDD Circular Platter Surface Track -->
    <ellipse cx="280" cy="285" rx="260" ry="85" fill="none" stroke="#64748b" stroke-width="18" opacity="0.45"/>
    <ellipse cx="280" cy="285" rx="200" ry="65" fill="none" stroke="#94a3b8" stroke-width="10" stroke-dasharray="8 6" opacity="0.5"/>

    <!-- Actuator Arm Metal Body as Roadway -->
    <path d="M 120,300 C 170,250 260,225 360,265 C 410,285 450,300 480,320" fill="none" stroke="#0f172a" stroke-width="26" stroke-linecap="round"/>
    <path d="M 120,300 C 170,250 260,225 360,265 C 410,285 450,300 480,320" fill="none" stroke="#e2e8f0" stroke-width="18" stroke-linecap="round"/>
    <!-- Center road dashed stripe -->
    <path d="M 130,295 C 175,252 260,228 358,266 C 405,285 445,300 475,318" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="10 8"/>

    <!-- Data Blocks (Paper Pages along the Road) -->
    <g transform="translate(135, 235)">
      <rect x="0" y="0" width="10" height="15" rx="1" fill="#ffffff" stroke="#334155" stroke-width="1"/>
      <rect x="15" y="-3" width="10" height="15" rx="1" fill="#ffffff" stroke="#334155" stroke-width="1"/>
      <rect x="30" y="-5" width="10" height="15" rx="1" fill="#ffffff" stroke="#334155" stroke-width="1"/>
      <rect x="45" y="-6" width="10" height="15" rx="1" fill="#ffffff" stroke="#334155" stroke-width="1"/>
      <rect x="60" y="-6" width="10" height="15" rx="1" fill="#ffffff" stroke="#334155" stroke-width="1"/>
    </g>

    <!-- Microchip Packages on Ground -->
    <g transform="translate(430, 260)">
      <rect x="0" y="0" width="18" height="18" rx="2" fill="#0f172a" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="32" y="10" width="22" height="22" rx="2" fill="#0f172a" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="-30" y="18" width="16" height="16" rx="2" fill="#0f172a" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="70" y="24" width="26" height="20" rx="2" fill="#0f172a" stroke="#cbd5e1" stroke-width="1"/>
    </g>

    <!-- TUX THE PENGUIN (sitting, holding NVMe SSD M.2 stick) -->
    <g transform="translate(560, 130) scale(1.4)">
      <!-- Penguin Shadow -->
      <ellipse cx="60" cy="118" rx="55" ry="12" fill="#000000" opacity="0.3"/>

      <!-- Penguin Body (Outer Black) -->
      <ellipse cx="60" cy="68" rx="42" ry="52" fill="#0f172a"/>
      <!-- Penguin White Belly -->
      <ellipse cx="60" cy="74" rx="28" ry="38" fill="#f8fafc"/>

      <!-- Penguin Head -->
      <circle cx="60" cy="32" r="28" fill="#0f172a"/>
      <!-- Penguin Eyes -->
      <ellipse cx="50" cy="26" rx="5" ry="8" fill="#ffffff"/>
      <circle cx="51" cy="26" r="3" fill="#0f172a"/>
      <circle cx="52" cy="24" r="1" fill="#ffffff"/>
      <ellipse cx="70" cy="26" rx="5" ry="8" fill="#ffffff"/>
      <circle cx="69" cy="26" r="3" fill="#0f172a"/>
      <circle cx="70" cy="24" r="1" fill="#ffffff"/>

      <!-- Penguin Orange Beak -->
      <polygon points="50,34 70,34 60,46" fill="#f59e0b"/>
      <ellipse cx="60" cy="36" rx="11" ry="5" fill="#d97706"/>

      <!-- Penguin Wings -->
      <ellipse cx="20" cy="72" rx="8" ry="26" fill="#0f172a" transform="rotate(22 20 72)"/>
      <ellipse cx="100" cy="72" rx="8" ry="26" fill="#0f172a" transform="rotate(-22 100 72)"/>

      <!-- Big Orange Feet Spread Out -->
      <ellipse cx="32" cy="115" rx="22" ry="9" fill="#f59e0b" stroke="#b45309" stroke-width="1.2"/>
      <ellipse cx="88" cy="115" rx="22" ry="9" fill="#f59e0b" stroke="#b45309" stroke-width="1.2"/>

      <!-- NVMe SSD M.2 Card Held in Hands -->
      <g transform="translate(14, 66) rotate(-8)">
        <rect x="0" y="0" width="84" height="28" rx="3" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
        <!-- Gold PCIe Connector Pins -->
        <rect x="2" y="24" width="4" height="4" fill="#fbbf24"/>
        <rect x="8" y="24" width="4" height="4" fill="#fbbf24"/>
        <rect x="14" y="24" width="4" height="4" fill="#fbbf24"/>
        <rect x="20" y="24" width="4" height="4" fill="#fbbf24"/>
        <rect x="26" y="24" width="4" height="4" fill="#fbbf24"/>
        <rect x="36" y="24" width="4" height="4" fill="#fbbf24"/>
        <rect x="42" y="24" width="4" height="4" fill="#fbbf24"/>
        <!-- Label Area -->
        <rect x="4" y="4" width="76" height="18" rx="2" fill="#020617"/>
        <text x="36" y="16" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="900" fill="#38bdf8" text-anchor="middle">NVMe SSD</text>
        <text x="68" y="16" font-family="monospace" font-size="7.5" font-weight="bold" fill="#ef4444" text-anchor="middle">M.2</text>
      </g>
    </g>
  </g>

  <!-- ==================== BOTTOM AUTHOR BANNER ==================== -->
  <g transform="translate(0, 1118)">
    <rect width="800" height="82" fill="#0d1117"/>
    <!-- Red Accent Stripe -->
    <line x1="80" y1="41" x2="210" y2="41" stroke="#b91c1c" stroke-width="3"/>
    <text x="400" y="50" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" letter-spacing="12" fill="#ffffff" text-anchor="middle">
      AVINASH PAL
    </text>
    <line x1="590" y1="41" x2="720" y2="41" stroke="#b91c1c" stroke-width="3"/>
  </g>
</svg>
