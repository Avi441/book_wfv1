<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <!-- Paper texture gradient -->
    <linearGradient id="kernPaperBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="25%" stop-color="#f8f4ec"/>
      <stop offset="70%" stop-color="#f3ede2"/>
      <stop offset="100%" stop-color="#ece4d6"/>
    </linearGradient>

    <!-- Card shadow -->
    <filter id="kernCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08" flood-color="#000000"/>
    </filter>

    <filter id="kernBadgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.18" flood-color="#000000"/>
    </filter>
  </defs>

  <!-- Background Paper -->
  <rect width="800" height="1200" fill="url(#kernPaperBg)"/>
  
  <!-- Subtle book spine left crease -->
  <rect x="0" y="0" width="18" height="1200" fill="#000000" opacity="0.06"/>
  <line x1="18" y1="0" x2="18" y2="1200" stroke="#000000" stroke-width="0.75" opacity="0.12"/>

  <!-- ==================== HEADER TYPOGRAPHY ==================== -->
  <text x="400" y="115" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" letter-spacing="3" text-anchor="middle" fill="#141c24">
    THINK LIKE A
  </text>
  <text x="400" y="240" font-family="'Impact', 'Arial Black', sans-serif" font-size="140" font-weight="900" letter-spacing="-2" text-anchor="middle" fill="#141c24">
    LINUX
  </text>
  <text x="400" y="355" font-family="'Impact', 'Arial Black', sans-serif" font-size="134" font-weight="900" letter-spacing="-1" text-anchor="middle" fill="#141c24">
    KERNEL
  </text>
  <text x="400" y="465" font-family="'Impact', 'Arial Black', sans-serif" font-size="112" font-weight="900" letter-spacing="-1" text-anchor="middle" fill="#b9251e">
    DEVELOPER
  </text>

  <!-- Dot Separator -->
  <circle cx="400" cy="492" r="5" fill="#1e293b"/>

  <!-- Subtitle -->
  <text x="400" y="528" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#1e293b">
    Mastering C Through Real
  </text>
  <text x="400" y="556" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <tspan fill="#1e293b">Linux Kernel </tspan>
    <tspan fill="#b9251e">Design Patterns</tspan>
  </text>

  <!-- ==================== QUOTE BRUSH BANNER ==================== -->
  <g transform="translate(100, 580)">
    <!-- Brush stroke banner shape -->
    <path d="M 0,22 Q 25,6 60,18 Q 200,4 320,16 Q 480,2 560,14 Q 590,18 600,24 Q 585,42 550,38 Q 420,44 260,38 Q 120,44 30,36 Q 5,34 0,22 Z" fill="#101720" filter="url(#kernBadgeShadow)"/>
    <rect x="25" y="6" width="550" height="34" rx="4" fill="#101720"/>
    
    <text x="300" y="29" font-family="'Georgia', serif" font-size="15" font-style="italic" font-weight="bold" text-anchor="middle" fill="#facc15">
      “ Learn not just how Linux kernel code works, but why it is designed that way. ”
    </text>
  </g>

  <!-- ==================== 4 TECHNICAL PILLARS ==================== -->
  <g transform="translate(60, 642)">
    <!-- 1. Real-World Analogies -->
    <g transform="translate(0, 0)">
      <rect width="158" height="96" rx="6" fill="#ffffff" stroke="#e2d8c7" stroke-width="1.2" filter="url(#kernCardShadow)"/>
      <!-- Steaming Red Coffee Cup Icon -->
      <g transform="translate(64, 12)">
        <rect x="0" y="16" width="24" height="20" rx="4" fill="#b91c1c"/>
        <path d="M 24,20 C 30,20 30,28 24,28" stroke="#b91c1c" stroke-width="2.5" fill="none"/>
        <ellipse cx="12" cy="16" rx="12" ry="3" fill="#ef4444"/>
        <!-- Steam waves -->
        <path d="M 5,10 C 3,6 7,2 5,-2" stroke="#b91c1c" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M 12,8 C 10,4 14,0 12,-4" stroke="#b91c1c" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M 19,10 C 17,6 21,2 19,-2" stroke="#b91c1c" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </g>
      <text x="79" y="70" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#1e293b">Real-World</text>
      <text x="79" y="85" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#1e293b">Analogies</text>
    </g>

    <!-- 2. C Concepts Made Simple -->
    <g transform="translate(174, 0)">
      <rect width="158" height="96" rx="6" fill="#ffffff" stroke="#e2d8c7" stroke-width="1.2" filter="url(#kernCardShadow)"/>
      <!-- Code bracket symbol </> in rounded box -->
      <g transform="translate(60, 14)">
        <rect x="0" y="0" width="38" height="34" rx="6" fill="#0f172a"/>
        <text x="19" y="24" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
      </g>
      <text x="79" y="70" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#1e293b">C Concepts</text>
      <text x="79" y="85" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#1e293b">Made Simple</text>
    </g>

    <!-- 3. Kernel Design Patterns -->
    <g transform="translate(348, 0)">
      <rect width="158" height="96" rx="6" fill="#ffffff" stroke="#e2d8c7" stroke-width="1.2" filter="url(#kernCardShadow)"/>
      <!-- Gear Cogwheel Icon -->
      <g transform="translate(62, 14)">
        <circle cx="17" cy="17" r="14" fill="#334155"/>
        <circle cx="17" cy="17" r="6" fill="#ffffff"/>
        <!-- Gear cogs -->
        <rect x="14" y="0" width="6" height="34" rx="1" fill="#334155"/>
        <rect x="0" y="14" width="34" height="6" rx="1" fill="#334155"/>
        <rect x="14" y="0" width="6" height="34" rx="1" fill="#334155" transform="rotate(45 17 17)"/>
        <rect x="0" y="14" width="34" height="6" rx="1" fill="#334155" transform="rotate(45 17 17)"/>
        <circle cx="17" cy="17" r="6" fill="#ffffff"/>
      </g>
      <text x="79" y="70" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#1e293b">Kernel</text>
      <text x="79" y="85" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#1e293b">Design Patterns</text>
    </g>

    <!-- 4. Complete Driver Walkthrough -->
    <g transform="translate(522, 0)">
      <rect width="158" height="96" rx="6" fill="#ffffff" stroke="#e2d8c7" stroke-width="1.2" filter="url(#kernCardShadow)"/>
      <!-- Terminal Window Icon >__ -->
      <g transform="translate(58, 14)">
        <rect x="0" y="0" width="42" height="34" rx="4" fill="#0f172a"/>
        <line x1="0" y1="8" x2="42" y2="8" stroke="#334155" stroke-width="1"/>
        <circle cx="5" cy="4" r="1.5" fill="#ef4444"/>
        <circle cx="10" cy="4" r="1.5" fill="#facc15"/>
        <circle cx="15" cy="4" r="1.5" fill="#22c55e"/>
        <text x="8" y="24" font-family="monospace" font-size="13" font-weight="bold" fill="#38bdf8">&gt;__</text>
      </g>
      <text x="79" y="70" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#1e293b">Complete Driver</text>
      <text x="79" y="85" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" fill="#1e293b">Walkthrough</text>
    </g>
  </g>

  <!-- ==================== SCENIC MOUNTAIN & WINDING ROAD LANDSCAPE ==================== -->
  <g transform="translate(0, 755)">
    <!-- Engraved Snowy Mountain Ranges -->
    <polygon points="0,170 120,60 210,135 340,30 450,140 550,50 680,130 800,45 800,260 0,260" fill="#202a36"/>
    <!-- Mountain Snow Highlights -->
    <polygon points="120,60 135,95 105,95" fill="#e2e8f0" opacity="0.8"/>
    <polygon points="340,30 365,80 320,80" fill="#e2e8f0" opacity="0.9"/>
    <polygon points="550,50 575,95 530,95" fill="#e2e8f0" opacity="0.85"/>
    <polygon points="800,45 780,90 800,100" fill="#e2e8f0" opacity="0.8"/>

    <!-- Mountain ridges cross-hatching -->
    <g stroke="#ffffff" stroke-width="0.8" opacity="0.4">
      <line x1="340" y1="30" x2="310" y2="120"/>
      <line x1="340" y1="30" x2="380" y2="130"/>
      <line x1="120" y1="60" x2="100" y2="140"/>
      <line x1="120" y1="60" x2="150" y2="140"/>
      <line x1="550" y1="50" x2="520" y2="130"/>
      <line x1="550" y1="50" x2="580" y2="130"/>
    </g>

    <!-- Pine Forest on mountain slopes -->
    <g fill="#0f172a">
      <polygon points="40,210 46,190 52,210"/>
      <polygon points="60,215 67,192 74,215"/>
      <polygon points="80,212 86,194 92,212"/>
      <polygon points="700,215 706,190 712,215"/>
      <polygon points="720,210 727,188 734,210"/>
      <polygon points="740,214 746,192 752,214"/>
    </g>

    <!-- Winding Asphalt Highway Road through the valley -->
    <g transform="translate(0, 0)">
      <path d="M 160,340 C 220,260 300,230 450,260 C 530,275 600,285 700,295" fill="none" stroke="#0f172a" stroke-width="48" stroke-linecap="round"/>
      <path d="M 160,340 C 220,260 300,230 450,260 C 530,275 600,285 700,295" fill="none" stroke="#334155" stroke-width="40" stroke-linecap="round"/>
      <path d="M 160,340 C 220,260 300,230 450,260 C 530,275 600,285 700,295" fill="none" stroke="#64748b" stroke-width="32" stroke-linecap="round"/>
      <!-- Road White Edge Stripes -->
      <path d="M 160,340 C 220,260 300,230 450,260 C 530,275 600,285 700,295" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="1 0"/>
      <!-- Dashed yellow highway center line -->
      <path d="M 170,335 C 225,262 302,232 448,260 C 528,275 595,285 690,295" fill="none" stroke="#facc15" stroke-width="2.5" stroke-dasharray="14 10"/>
    </g>

    <!-- TUX THE PENGUIN (sitting by the road, hands on belly, smiling) -->
    <g transform="translate(500, 130) scale(1.4)">
      <!-- Penguin Shadow -->
      <ellipse cx="60" cy="118" rx="55" ry="12" fill="#000000" opacity="0.3"/>

      <!-- Penguin Body (Outer Black) -->
      <ellipse cx="60" cy="68" rx="42" ry="52" fill="#0f172a"/>
      <!-- Penguin White Belly -->
      <ellipse cx="60" cy="74" rx="28" ry="38" fill="#f8fafc"/>

      <!-- Penguin Head -->
      <circle cx="60" cy="32" r="28" fill="#0f172a"/>
      <!-- Penguin Eyes -->
      <ellipse cx="50" cy="26" rx="5" ry="8" fill="#ffffff"/>
      <circle cx="51" cy="26" r="3" fill="#0f172a"/>
      <circle cx="52" cy="24" r="1" fill="#ffffff"/>
      <ellipse cx="70" cy="26" rx="5" ry="8" fill="#ffffff"/>
      <circle cx="69" cy="26" r="3" fill="#0f172a"/>
      <circle cx="70" cy="24" r="1" fill="#ffffff"/>

      <!-- Penguin Orange Beak -->
      <polygon points="50,34 70,34 60,46" fill="#f59e0b"/>
      <ellipse cx="60" cy="36" rx="11" ry="5" fill="#d97706"/>

      <!-- Penguin Wings at side -->
      <ellipse cx="20" cy="72" rx="8" ry="26" fill="#0f172a" transform="rotate(22 20 72)"/>
      <ellipse cx="100" cy="72" rx="8" ry="26" fill="#0f172a" transform="rotate(-22 100 72)"/>

      <!-- Big Orange Feet Spread Out in Foreground -->
      <ellipse cx="32" cy="115" rx="22" ry="9" fill="#f59e0b" stroke="#b45309" stroke-width="1.2"/>
      <ellipse cx="88" cy="115" rx="22" ry="9" fill="#f59e0b" stroke="#b45309" stroke-width="1.2"/>
    </g>
  </g>

  <!-- ==================== BOTTOM AUTHOR BANNER ==================== -->
  <g transform="translate(0, 1118)">
    <rect width="800" height="82" fill="#0d1117"/>
    <!-- Red Accent Stripe -->
    <line x1="80" y1="41" x2="210" y2="41" stroke="#b91c1c" stroke-width="3"/>
    <text x="400" y="50" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" letter-spacing="12" fill="#ffffff" text-anchor="middle">
      AVINASH PAL
    </text>
    <line x1="590" y1="41" x2="720" y2="41" stroke="#b91c1c" stroke-width="3"/>
  </g>
</svg>
