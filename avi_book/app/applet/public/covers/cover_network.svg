<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <!-- Paper texture gradient -->
    <linearGradient id="netPaperBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="25%" stop-color="#f8f4ec"/>
      <stop offset="70%" stop-color="#f3ede2"/>
      <stop offset="100%" stop-color="#ece4d6"/>
    </linearGradient>

    <!-- Card shadow -->
    <filter id="netCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08" flood-color="#000000"/>
    </filter>

    <filter id="netBadgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.18" flood-color="#000000"/>
    </filter>
  </defs>

  <!-- Background Paper -->
  <rect width="800" height="1200" fill="url(#netPaperBg)"/>
  
  <!-- Subtle book spine left crease -->
  <rect x="0" y="0" width="18" height="1200" fill="#000000" opacity="0.06"/>
  <line x1="18" y1="0" x2="18" y2="1200" stroke="#000000" stroke-width="0.75" opacity="0.12"/>

  <!-- ==================== HEADER TYPOGRAPHY ==================== -->
  <text x="400" y="115" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" letter-spacing="3" text-anchor="middle" fill="#141c24">
    THINK LIKE A
  </text>
  
  <!-- LINUX with Tux Silhouette inside the N -->
  <g transform="translate(400, 240)">
    <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-size="140" font-weight="900" letter-spacing="-2" text-anchor="middle" fill="#141c24">
      LINUX
    </text>
    <!-- Tux in the letter 'N' -->
    <g transform="translate(-10, -68) scale(0.48)">
      <ellipse cx="20" cy="30" rx="14" ry="18" fill="#ffffff"/>
      <circle cx="20" cy="12" r="10" fill="#ffffff"/>
      <ellipse cx="20" cy="32" rx="9" ry="13" fill="#141c24"/>
      <polygon points="17,16 23,16 20,22" fill="#f59e0b"/>
    </g>
  </g>

  <text x="400" y="355" font-family="'Impact', 'Arial Black', sans-serif" font-size="118" font-weight="900" letter-spacing="-1" text-anchor="middle" fill="#b9251e">
    NETWORK
  </text>
  <text x="400" y="465" font-family="'Impact', 'Arial Black', sans-serif" font-size="112" font-weight="900" letter-spacing="-1" text-anchor="middle" fill="#b9251e">
    ENGINEER
  </text>

  <!-- Dot Separator -->
  <circle cx="400" cy="492" r="5" fill="#1e293b"/>

  <!-- Subtitle -->
  <text x="400" y="528" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18.5" font-weight="700" text-anchor="middle" fill="#1e293b">
    Learn Linux Networking Through Real-Life Analogies,
  </text>
  <text x="400" y="556" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18.5" font-weight="700" text-anchor="middle" fill="#1e293b">
    Practical Examples, Kernel Internals &amp; Debugging
  </text>

  <!-- ==================== HARD CONCEPTS SIMPLE ANALOGIES BADGE ==================== -->
  <g transform="translate(60, 580)">
    <!-- Brush badge shape -->
    <path d="M 0,24 Q 25,6 70,18 Q 220,4 360,16 Q 520,2 620,14 Q 660,18 680,24 Q 660,44 620,38 Q 480,44 320,38 Q 140,44 40,36 Q 10,34 0,24 Z" fill="#101720" filter="url(#netBadgeShadow)"/>
    <rect x="25" y="6" width="630" height="36" rx="4" fill="#101720"/>

    <!-- Lightbulb Icon -->
    <g transform="translate(45, 12) scale(0.9)">
      <circle cx="12" cy="12" r="9" fill="#facc15"/>
      <rect x="9" y="21" width="6" height="4" fill="#94a3b8"/>
      <line x1="12" y1="-2" x2="12" y2="1" stroke="#facc15" stroke-width="2"/>
      <line x1="2" y1="4" x2="5" y2="6" stroke="#facc15" stroke-width="2"/>
      <line x1="22" y1="4" x2="19" y2="6" stroke="#facc15" stroke-width="2"/>
    </g>

    <text x="350" y="23" font-family="'Impact', 'Arial Black', sans-serif" font-size="15" font-weight="900" letter-spacing="1" text-anchor="middle">
      <tspan fill="#ffffff">HARD CONCEPTS. </tspan>
      <tspan fill="#facc15">SIMPLE ANALOGIES.</tspan>
    </text>
    <text x="350" y="38" font-family="'Georgia', serif" font-size="12.5" font-style="italic" text-anchor="middle" fill="#ffffff">
      Real-Life Examples That Make Linux Networking Easy.
    </text>
  </g>

  <!-- ==================== 5 ANALOGY CARDS WITH ARROWS ==================== -->
  <g transform="translate(30, 642)">
    <!-- 1. Post Office -> Packets -->
    <g transform="translate(0, 0)">
      <rect width="134" height="96" rx="6" fill="#ffffff" stroke="#e2d8c7" stroke-width="1.2" filter="url(#netCardShadow)"/>
      <!-- Header Pill -->
      <rect x="8" y="68" width="118" height="15" rx="3" fill="#fef08a"/>
      <text x="67" y="79" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="800" text-anchor="middle" fill="#854d0e">Post Office</text>
      <text x="67" y="90" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle" fill="#0f172a">→ Packets</text>
      <!-- Post office cartoon icon -->
      <g transform="translate(32, 10)">
        <polygon points="35,5 65,18 5,18" fill="#b91c1c"/>
        <rect x="10" y="18" width="50" height="30" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
        <rect x="18" y="26" width="12" height="22" fill="#3b82f6"/>
        <!-- Red mailbox -->
        <rect x="42" y="28" width="12" height="18" rx="2" fill="#ef4444"/>
        <line x1="42" y1="34" x2="54" y2="34" stroke="#ffffff" stroke-width="1"/>
      </g>
    </g>

    <!-- Arrow 1 -->
    <text x="142" y="52" font-family="sans-serif" font-size="14" font-weight="bold" fill="#64748b">→</text>

    <!-- 2. Roads -> Routing -->
    <g transform="translate(154, 0)">
      <rect width="134" height="96" rx="6" fill="#ffffff" stroke="#e2d8c7" stroke-width="1.2" filter="url(#netCardShadow)"/>
      <rect x="8" y="68" width="118" height="15" rx="3" fill="#fef08a"/>
      <text x="67" y="79" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="800" text-anchor="middle" fill="#854d0e">Roads</text>
      <text x="67" y="90" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle" fill="#0f172a">→ Routing</text>
      <!-- Highway road icon -->
      <g transform="translate(32, 10)">
        <path d="M 10,50 L 26,10 L 44,10 L 60,50 Z" fill="#475569"/>
        <line x1="35" y1="12" x2="35" y2="48" stroke="#facc15" stroke-width="1.5" stroke-dasharray="4 3"/>
        <!-- Mini cars -->
        <rect x="22" y="32" width="7" height="10" rx="1" fill="#3b82f6"/>
        <rect x="40" y="22" width="7" height="10" rx="1" fill="#ef4444"/>
      </g>
    </g>

    <!-- Arrow 2 -->
    <text x="296" y="52" font-family="sans-serif" font-size="14" font-weight="bold" fill="#64748b">→</text>

    <!-- 3. Building Reception -> Firewall -->
    <g transform="translate(308, 0)">
      <rect width="134" height="96" rx="6" fill="#ffffff" stroke="#e2d8c7" stroke-width="1.2" filter="url(#netCardShadow)"/>
      <rect x="8" y="68" width="118" height="15" rx="3" fill="#fef08a"/>
      <text x="67" y="79" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle" fill="#854d0e">Building Reception</text>
      <text x="67" y="90" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle" fill="#0f172a">→ Firewall</text>
      <!-- Receptionist Desk icon -->
      <g transform="translate(32, 10)">
        <rect x="6" y="24" width="58" height="24" rx="2" fill="#ca8a04"/>
        <circle cx="35" cy="16" r="7" fill="#0f766e"/>
        <rect x="26" y="24" width="18" height="12" fill="#0284c7"/>
        <rect x="22" y="28" width="10" height="8" rx="1" fill="#0f172a"/>
      </g>
    </g>

    <!-- Arrow 3 -->
    <text x="450" y="52" font-family="sans-serif" font-size="14" font-weight="bold" fill="#64748b">→</text>

    <!-- 4. Phone Call -> Socket -->
    <g transform="translate(462, 0)">
      <rect width="134" height="96" rx="6" fill="#ffffff" stroke="#e2d8c7" stroke-width="1.2" filter="url(#netCardShadow)"/>
      <rect x="8" y="68" width="118" height="15" rx="3" fill="#fef08a"/>
      <text x="67" y="79" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="800" text-anchor="middle" fill="#854d0e">Phone Call</text>
      <text x="67" y="90" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle" fill="#0f172a">→ Socket</text>
      <!-- Smartphone with ringing waves icon -->
      <g transform="translate(38, 10)">
        <rect x="14" y="6" width="28" height="42" rx="4" fill="#0284c7" stroke="#0f172a" stroke-width="1"/>
        <circle cx="28" cy="24" r="7" fill="#22c55e"/>
        <path d="M 6,18 C 3,22 3,28 6,32" stroke="#0284c7" stroke-width="2" fill="none"/>
        <path d="M 50,18 C 53,22 53,28 50,32" stroke="#0284c7" stroke-width="2" fill="none"/>
      </g>
    </g>

    <!-- Arrow 4 -->
    <text x="604" y="52" font-family="sans-serif" font-size="14" font-weight="bold" fill="#64748b">→</text>

    <!-- 5. Traffic Controller -> Network Stack -->
    <g transform="translate(616, 0)">
      <rect width="124" height="96" rx="6" fill="#ffffff" stroke="#e2d8c7" stroke-width="1.2" filter="url(#netCardShadow)"/>
      <rect x="4" y="68" width="116" height="15" rx="3" fill="#fef08a"/>
      <text x="62" y="79" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="800" text-anchor="middle" fill="#854d0e">Traffic Controller</text>
      <text x="62" y="90" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="800" text-anchor="middle" fill="#0f172a">→ Network Stack</text>
      <!-- Traffic Light & Policeman -->
      <g transform="translate(32, 10)">
        <!-- Traffic Light -->
        <rect x="34" y="4" width="12" height="26" rx="2" fill="#0f172a"/>
        <circle cx="40" cy="9" r="2.5" fill="#ef4444"/>
        <circle cx="40" cy="17" r="2.5" fill="#facc15"/>
        <circle cx="40" cy="25" r="2.5" fill="#22c55e"/>
        <line x1="40" y1="30" x2="40" y2="48" stroke="#475569" stroke-width="2"/>
        <!-- Officer -->
        <circle cx="18" cy="22" r="5" fill="#f59e0b"/>
        <rect x="12" y="27" width="12" height="18" fill="#1e3a8a"/>
      </g>
    </g>
  </g>

  <!-- ==================== SCENIC BLUE ETHERNET LANDSCAPE ==================== -->
  <g transform="translate(0, 755)">
    <!-- Setting Red Sun -->
    <circle cx="410" cy="115" r="46" fill="#e2573e"/>

    <!-- Mountain Peaks -->
    <polygon points="0,170 120,60 210,135 340,30 450,140 550,50 680,130 800,45 800,260 0,260" fill="#202a36"/>
    <polygon points="120,60 135,95 105,95" fill="#e2e8f0" opacity="0.8"/>
    <polygon points="340,30 365,80 320,80" fill="#e2e8f0" opacity="0.9"/>
    <polygon points="550,50 575,95 530,95" fill="#e2e8f0" opacity="0.85"/>

    <!-- Server Racks in Mountains (Left side) -->
    <g transform="translate(230, 95)">
      <rect x="0" y="0" width="36" height="75" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
      <line x1="4" y1="12" x2="32" y2="12" stroke="#22c55e" stroke-width="1"/>
      <line x1="4" y1="24" x2="32" y2="24" stroke="#22c55e" stroke-width="1"/>
      <line x1="4" y1="36" x2="32" y2="36" stroke="#22c55e" stroke-width="1"/>
      <rect x="42" y="-10" width="40" height="85" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
      <line x1="46" y1="18" x2="78" y2="18" stroke="#22c55e" stroke-width="1"/>
      <line x1="46" y1="36" x2="78" y2="36" stroke="#22c55e" stroke-width="1"/>
      <line x1="46" y1="54" x2="78" y2="54" stroke="#22c55e" stroke-width="1"/>
    </g>

    <!-- Network Switch on Pedestal in Center -->
    <g transform="translate(430, 160)">
      <ellipse cx="50" cy="18" rx="50" ry="12" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
      <text x="50" y="22" font-family="monospace" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">&lt; - &gt;</text>
    </g>

    <!-- Rack on Right -->
    <g transform="translate(650, 105)">
      <rect x="0" y="0" width="40" height="80" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
      <line x1="4" y1="16" x2="36" y2="16" stroke="#38bdf8" stroke-width="1"/>
      <line x1="4" y1="32" x2="36" y2="32" stroke="#38bdf8" stroke-width="1"/>
      <line x1="4" y1="48" x2="36" y2="48" stroke="#38bdf8" stroke-width="1"/>
      <rect x="46" y="-8" width="40" height="88" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
      <line x1="50" y1="16" x2="82" y2="16" stroke="#38bdf8" stroke-width="1"/>
      <line x1="50" y1="32" x2="82" y2="32" stroke="#38bdf8" stroke-width="1"/>
      <line x1="50" y1="48" x2="82" y2="48" stroke="#38bdf8" stroke-width="1"/>
    </g>

    <!-- Winding Blue Ethernet Cable Highway -->
    <g transform="translate(0, 0)">
      <!-- Main thick highway road -->
      <path d="M 0,300 C 140,240 280,210 440,250 C 560,280 620,300 720,320" fill="none" stroke="#0284c7" stroke-width="32" stroke-linecap="round"/>
      <path d="M 0,300 C 140,240 280,210 440,250 C 560,280 620,300 720,320" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round"/>
      <!-- Internal wiring stripes -->
      <path d="M 0,300 C 140,240 280,210 440,250 C 560,280 620,300 720,320" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="14 10"/>

      <!-- Parallel second Ethernet cable -->
      <path d="M 50,320 C 180,270 300,240 460,280 C 540,300 620,315 700,335" fill="none" stroke="#0369a1" stroke-width="14" stroke-linecap="round"/>
      
      <!-- Modular RJ45 Cable Boot Connectors along the road -->
      <g transform="translate(260, 245) rotate(-14)">
        <rect x="0" y="0" width="36" height="24" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
        <rect x="28" y="4" width="8" height="16" fill="#fbbf24"/>
        <line x1="6" y1="8" x2="24" y2="8" stroke="#0284c7" stroke-width="2"/>
        <line x1="6" y1="16" x2="24" y2="16" stroke="#0284c7" stroke-width="2"/>
      </g>
      <g transform="translate(420, 275) rotate(12)">
        <rect x="0" y="0" width="36" height="24" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
        <rect x="28" y="4" width="8" height="16" fill="#fbbf24"/>
      </g>
    </g>

    <!-- Switch device box in middle foreground -->
    <g transform="translate(300, 210)">
      <rect x="0" y="0" width="140" height="34" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- RJ45 Ports on switch -->
      <rect x="12" y="8" width="12" height="18" rx="1" fill="#1e293b" stroke="#64748b"/>
      <rect x="28" y="8" width="12" height="18" rx="1" fill="#1e293b" stroke="#64748b"/>
      <rect x="44" y="8" width="12" height="18" rx="1" fill="#1e293b" stroke="#64748b"/>
      <rect x="60" y="8" width="12" height="18" rx="1" fill="#1e293b" stroke="#64748b"/>
      <rect x="76" y="8" width="12" height="18" rx="1" fill="#1e293b" stroke="#64748b"/>
      <rect x="92" y="8" width="12" height="18" rx="1" fill="#1e293b" stroke="#64748b"/>
      <!-- Green Link LEDs -->
      <circle cx="18" cy="5" r="1.5" fill="#22c55e"/>
      <circle cx="34" cy="5" r="1.5" fill="#22c55e"/>
      <circle cx="50" cy="5" r="1.5" fill="#22c55e"/>
      <circle cx="66" cy="5" r="1.5" fill="#22c55e"/>
      <circle cx="82" cy="5" r="1.5" fill="#22c55e"/>
      <circle cx="98" cy="5" r="1.5" fill="#22c55e"/>
    </g>

    <!-- TUX THE PENGUIN (sitting, holding RJ45 Ethernet Cable) -->
    <g transform="translate(500, 140) scale(1.4)">
      <!-- Penguin Shadow -->
      <ellipse cx="60" cy="118" rx="55" ry="12" fill="#000000" opacity="0.3"/>

      <!-- Penguin Body (Outer Black) -->
      <ellipse cx="60" cy="68" rx="42" ry="52" fill="#0f172a"/>
      <!-- Penguin White Belly -->
      <ellipse cx="60" cy="74" rx="28" ry="38" fill="#f8fafc"/>

      <!-- Penguin Head -->
      <circle cx="60" cy="32" r="28" fill="#0f172a"/>
      <!-- Penguin Eyes -->
      <ellipse cx="50" cy="26" rx="5" ry="8" fill="#ffffff"/>
      <circle cx="51" cy="26" r="3" fill="#0f172a"/>
      <circle cx="52" cy="24" r="1" fill="#ffffff"/>
      <ellipse cx="70" cy="26" rx="5" ry="8" fill="#ffffff"/>
      <circle cx="69" cy="26" r="3" fill="#0f172a"/>
      <circle cx="70" cy="24" r="1" fill="#ffffff"/>

      <!-- Penguin Orange Beak -->
      <polygon points="50,34 70,34 60,46" fill="#f59e0b"/>
      <ellipse cx="60" cy="36" rx="11" ry="5" fill="#d97706"/>

      <!-- Penguin Wings -->
      <ellipse cx="20" cy="72" rx="8" ry="26" fill="#0f172a" transform="rotate(22 20 72)"/>
      <ellipse cx="100" cy="72" rx="8" ry="26" fill="#0f172a" transform="rotate(-22 100 72)"/>

      <!-- Big Orange Feet Spread Out -->
      <ellipse cx="32" cy="115" rx="22" ry="9" fill="#f59e0b" stroke="#b45309" stroke-width="1.2"/>
      <ellipse cx="88" cy="115" rx="22" ry="9" fill="#f59e0b" stroke="#b45309" stroke-width="1.2"/>

      <!-- Blue Ethernet Cable + RJ45 Modular Plug Held in Hand -->
      <g transform="translate(18, 55) rotate(35)">
        <!-- Thick Blue Cable loop -->
        <path d="M 0,40 C 15,25 35,20 50,35" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round"/>
        <!-- RJ45 Plug Plastic Head -->
        <rect x="35" y="10" width="34" height="24" rx="3" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
        <!-- Gold Contact Pins -->
        <rect x="58" y="12" width="4" height="20" fill="#fbbf24"/>
        <line x1="40" y1="16" x2="56" y2="16" stroke="#0284c7" stroke-width="1.5"/>
        <line x1="40" y1="22" x2="56" y2="22" stroke="#0284c7" stroke-width="1.5"/>
        <line x1="40" y1="28" x2="56" y2="28" stroke="#0284c7" stroke-width="1.5"/>
        <!-- Plastic Clip -->
        <polygon points="42,8 52,4 52,10" fill="#cbd5e1" stroke="#475569" stroke-width="0.8"/>
      </g>
    </g>
  </g>

  <!-- ==================== BOTTOM AUTHOR BANNER ==================== -->
  <g transform="translate(0, 1118)">
    <rect width="800" height="82" fill="#0d1117"/>
    <!-- Red Accent Stripe -->
    <line x1="80" y1="41" x2="210" y2="41" stroke="#b91c1c" stroke-width="3"/>
    <text x="400" y="50" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" letter-spacing="12" fill="#ffffff" text-anchor="middle">
      AVINASH PAL
    </text>
    <line x1="590" y1="41" x2="720" y2="41" stroke="#b91c1c" stroke-width="3"/>
  </g>
</svg>
